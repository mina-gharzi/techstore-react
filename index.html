<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore | فروشگاه آنلاین لوازم دیجیتال</title>
    <meta
      name="description"
      content="خرید آنلاین موبایل، لپ‌تاپ، ساعت هوشمند و لوازم جانبی دیجیتال با بهترین قیمت، ضمانت اصالت کالا و ارسال سریع."
    />
    <!--
      نکته: فونت Vazirmatn قبلاً هم از CDN اینجا لود می‌شد هم از فایل
      لوکال (توی index.css با @font-face از /fonts/Vazirmatn-Regular.ttf).
      لود دوباره یعنی حجم اضافه + یک وابستگی غیرضروری به یک CDN خارجی.
      این‌جا لینک CDN حذف شد و فقط نسخه‌ی لوکال (که سریع‌تر و آفلاین
      هم کار می‌کنه) باقی موند. اگه فایل /fonts/Vazirmatn-Regular.ttf
      واقعاً توی پوشه public/fonts نیست، حتماً قبل از حذف این لینک
      اضافه‌ش کن، وگرنه فونت اصلاً لود نمی‌شه.
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      نکته: دو اسکریپت زیر (react-grab و same-runtime) قبلاً این‌جا بودن
      ولی هیچ‌جای پروژه استفاده نمی‌شدن - ظاهراً باقی‌مونده‌ی یک
      استارتر/ابزار بیرونی بودن، نه بخشی از کد خودت. برای کاهش حجم و
      جلوگیری از لود اسکریپت ناشناس روی سایت واقعی حذف شدن. اگه بعداً
      متوجه شدی واقعاً به یکیشون نیاز داری، برش‌گردون.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
